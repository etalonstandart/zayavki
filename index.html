<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Заявка">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">
<title>Заявка на счётчик</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8; color: #222; min-height: 100vh; padding: 16px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .container { max-width: 520px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  h1 { font-size: 19px; margin: 0 0 20px; color: #1976d2; text-align: center; font-weight: 700; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #455a64; }
  .field input[type="text"], .field textarea { width: 100%; padding: 13px 14px; border: 1px solid #cfd8dc; border-radius: 10px; font-size: 16px; background: #fafafa; transition: 0.15s; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input[type="text"]:focus, .field textarea:focus { outline: none; border-color: #1976d2; background: #fff; box-shadow: 0 0 0 3px rgba(25,118,210,0.1); }
  .photo-buttons { display: flex; gap: 8px; }
  .photo-btn { flex: 1; padding: 12px 10px; font-size: 14px; font-weight: 600; background: #eceff1; color: #37474f; border: 1px solid #cfd8dc; border-radius: 10px; cursor: pointer; }
  .photo-btn:active { background: #cfd8dc; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .photo-grid:empty { display: none; }
  .photo-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid #cfd8dc; background: #f5f5f5; }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-item .remove { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; background: rgba(0,0,0,0.65); color: #fff; border: none; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-family: Arial, sans-serif; }
  .photo-counter { font-size: 12px; color: #2e7d32; margin-top: 6px; display: none; }
  .geo-block { display: flex; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; background: #fff8e1; color: #e65100; border: 1px solid #ffe0b2; line-height: 1.4; }
  .geo-block.ok { background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; }
  .geo-block.err { background: #ffebee; color: #c62828; border-color: #ffcdd2; }
  .geo-block .icon { font-size: 18px; margin-right: 10px; }
  .geo-block .text { flex: 1; }
  .geo-block .coords { display: block; font-family: monospace; font-size: 11px; opacity: 0.75; margin-top: 3px; }
  button[type="submit"] { width: 100%; padding: 16px; font-size: 16px; font-weight: 700; color: #fff; background: #25D366; border: none; border-radius: 12px; cursor: pointer; margin-top: 8px; }
  button[type="submit"]:active { transform: scale(0.98); background: #1eac52; }
  button[type="submit"]:disabled { background: #90a4ae; cursor: not-allowed; }
  .footer-note { text-align: center; font-size: 11px; color: #90a4ae; margin-top: 16px; line-height: 1.5; }
  #lockScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .lock-card { background: #fff; border-radius: 16px; padding: 28px 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  .lock-card .lock-icon { font-size: 44px; margin-bottom: 8px; }
  .lock-card h2 { margin: 0 0 6px; font-size: 20px; color: #1976d2; }
  .lock-card p { margin: 0 0 20px; font-size: 13px; color: #607d8b; line-height: 1.5; }
  .lock-card input { width: 100%; padding: 14px; border: 2px solid #cfd8dc; border-radius: 10px; font-size: 22px; text-align: center; letter-spacing: 4px; font-family: monospace; font-weight: 700; background: #fafafa; margin-bottom: 12px; }
  .lock-card input:focus { outline: none; border-color: #1976d2; background: #fff; }
  .lock-card button { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; color: #fff; background: #1976d2; border: none; border-radius: 10px; cursor: pointer; }
  .lock-card button:active { background: #1565c0; }
  .lock-error { color: #c62828; font-size: 13px; margin-top: 12px; min-height: 18px; font-weight: 600; }
  .lock-status { color: #607d8b; font-size: 11px; margin-top: 4px; min-height: 16px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(80px); background: #263238; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 1000; max-width: 90%; text-align: center; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>Доступ закрыт</h2>
    <p>Введите код доступа,<br>полученный от администратора</p>
    <input type="tel" inputmode="numeric" id="codeInput" autocomplete="off" maxlength="5">
    <button type="button" id="unlockBtn">Войти</button>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-status" id="lockStatus">Подключение к серверу...</div>
  </div>
</div>

<div class="container" id="appScreen" style="display:none;">
  <h1>🔧 Заявка на счётчик</h1>

  <form id="form" novalidate autocomplete="off">
    <div class="field">
      <label>Адрес объекта</label>
      <input type="text" id="address" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
    </div>
    <div class="field">
      <label>Телефон</label>
      <input type="text" inputmode="tel" id="phone" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" data-1p-ignore="true">
    </div>
    <div class="field">
      <label>Модель счётчика</label>
      <input type="text" id="meterModel" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="field">
      <label>Комментарий</label>
      <textarea id="comment" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" rows="3"></textarea>
    </div>
    <div class="field">
      <label>Фото объекта</label>
      <div class="photo-buttons">
        <button type="button" class="photo-btn" id="cameraBtn">📷 Снять</button>
        <button type="button" class="photo-btn" id="galleryBtn">🖼 Из галереи</button>
      </div>
      <input type="file" accept="image/*" capture="environment" id="cameraInput" hidden>
      <input type="file" accept="image/*" multiple id="galleryInput" hidden>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="photo-counter" id="photoCounter"></div>
    </div>
    <div class="geo-block" id="geoBlock">
      <span class="icon">📍</span>
      <span class="text" id="geoText">Определяем местоположение...</span>
    </div>
    <button type="submit" id="submitBtn">Отправить в WhatsApp</button>
  </form>
  <div class="footer-note">Все поля необязательные</div>
</div>

<div class="toast" id="toast"></div>

<!-- ============== СКРИПТ 1 ============== -->
<script>
  const LS_KEY     = 'gas_access_code';
  const DEVICE_KEY = 'gas_device_id';
  const NEXT_NUM_KEY = 'gas_next_number';   // локальный «запас номера»

  const INITIAL_CODES = [
    '48217','93641','27580','61934','70825',
    '15096','82473','39761','56208','94150',
    '68302','47019','25847','71693','38520',
    '92064','14738','57926','80615','63471',
    '25893','74160','50928','16385','89742',
    '41570','96238','73051','58194','20687'
  ];

  window.gasConstants = { LS_KEY, DEVICE_KEY, NEXT_NUM_KEY, INITIAL_CODES };

  const geoBlock = document.getElementById('geoBlock');
  const geoText  = document.getElementById('geoText');
  let coords = null;
  let geoCleanups = [];

  function setGeo(state, html) {
    geoBlock.className = 'geo-block ' + (state || '');
    geoText.innerHTML = html;
  }

  function yandexLink(lat, lon) {
    return `https://yandex.ru/maps/?pt=${lon},${lat}&z=18&l=map`;
  }

  function renderGeoOk() {
    if (!coords) return;
    setGeo('ok', '✅ Местоположение определено' +
      `<span class="coords">${coords.lat.toFixed(5)}, ${coords.lon.toFixed(5)} · ±${Math.round(coords.acc)} м</span>`);
  }

  function getFreshCoords() {
    return new Promise((resolve) => {
      if (!('geolocation' in navigator)) return resolve(null);
      let finished = false;
      const timer = setTimeout(() => {
        if (finished) return; finished = true; resolve(null);
      }, 5500);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (finished) return; finished = true; clearTimeout(timer);
          resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy });
        },
        () => { if (finished) return; finished = true; clearTimeout(timer); resolve(null); },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    });
  }

  function startGeo() {
    geoCleanups.forEach(fn => { try { fn(); } catch(e){} });
    geoCleanups = [];
    coords = null;
    if (!('geolocation' in navigator)) { setGeo('err', '❌ Геолокация не поддерживается'); return; }
    setGeo('', '📍 Определяем местоположение...');

    let done = false;
    let best = null;

    function tryFinish() {
      if (done || !best) return;
      done = true;
      geoCleanups.forEach(fn => { try { fn(); } catch(e){} });
      geoCleanups = [];
      coords = best;
      renderGeoOk();
    }
    function onPos(pos) {
      if (done) return;
      const p = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
      if (!best || p.acc < best.acc) best = p;
      if (p.acc <= 150) tryFinish();
    }

    try {
      const wid1 = navigator.geolocation.watchPosition(onPos, () => {},
        { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 });
      geoCleanups.push(() => navigator.geolocation.clearWatch(wid1));
    } catch (e) {}
    try {
      const wid2 = navigator.geolocation.watchPosition(onPos, () => {},
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
      geoCleanups.push(() => navigator.geolocation.clearWatch(wid2));
    } catch (e) {}

    const lockIn = setTimeout(() => { if (best && !done) tryFinish(); }, 3000);
    geoCleanups.push(() => clearTimeout(lockIn));

    const retryTimer = setTimeout(async () => {
      if (done) return;
      if (best) { tryFinish(); return; }
      setGeo('', '📍 Уточняем координаты...');
      for (let i = 1; i <= 3; i++) {
        if (done) return;
        try {
          const pos = await new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej,
              { enableHighAccuracy: false, timeout: 8000, maximumAge: 0 });
          });
          best = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
          tryFinish();
          return;
        } catch (e) {}
        await new Promise(r => setTimeout(r, 1500));
      }
      if (!done) {
        geoCleanups.forEach(fn => { try { fn(); } catch(e){} });
        geoCleanups = [];
        setGeo('err', '⚠️ Не удалось определить координаты.');
      }
    }, 15000);
    geoCleanups.push(() => clearTimeout(retryTimer));
  }

  window.startGeo = startGeo;
  window.getFreshCoords = getFreshCoords;
  window.getCoords = function() { return coords; };
  window.setCoords = function(c) { coords = c; };
  window.yandexLink = yandexLink;

  window.unlockApp = function() {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    if (!coords) startGeo();
    // Подтягиваем номер заранее
    if (typeof window.warmUpNextNumber === 'function') window.warmUpNextNumber();
  };
  window.lockApp = function(reason) {
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
    if (reason) document.getElementById('lockStatus').textContent = reason;
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => startGeo());
  } else { startGeo(); }

  (function() {
    const saved = localStorage.getItem(LS_KEY);
    if (saved && INITIAL_CODES.includes(saved)) {
      document.getElementById('lockStatus').textContent = 'Офлайн-доступ';
      window.unlockApp();
      window.gasOfflineAccessGranted = true;
    }
  })();
</script>

<!-- ============== СКРИПТ 2 — Firebase ============== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCofoBIWqUX_P8pQUIKKbitEG2GTbXT7Ak",
  authDomain: "botstm100.firebaseapp.com",
  databaseURL: "https://botstm100-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "botstm100",
  storageBucket: "botstm100.firebasestorage.app",
  messagingSenderId: "462080340216",
  appId: "1:462080340216:web:c452983a1501f0bf170b0d"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const { LS_KEY, DEVICE_KEY, NEXT_NUM_KEY, INITIAL_CODES } = window.gasConstants;
const lockStatusEl = document.getElementById('lockStatus');
const lockErrorEl  = document.getElementById('lockError');

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) {
    id = 'dev-' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
    localStorage.setItem(DEVICE_KEY, id);
  }
  return id;
}
const DEVICE_ID = getDeviceId();
window.gasDeviceId = DEVICE_ID;

async function ensureCodesExist() {
  try {
    const snap = await get(ref(db, 'access_codes'));
    if (snap.exists()) {
      const data = snap.val();
      for (const code of INITIAL_CODES) {
        if (!data[code]) {
          await set(ref(db, `access_codes/${code}`), { available: true });
        }
      }
      return;
    }
    const initial = {};
    for (const code of INITIAL_CODES) initial[code] = { available: true };
    await set(ref(db, 'access_codes'), initial);
  } catch (e) { console.warn('[firebase] ensureCodesExist:', e.message); }
}

async function findDeviceCode() {
  try {
    const snap = await get(ref(db, 'access_codes'));
    if (!snap.exists()) return null;
    const data = snap.val();
    for (const code in data) {
      if (data[code] && data[code].usedBy === DEVICE_ID) return code;
    }
    return null;
  } catch (e) { return null; }
}

async function verifyAccessOnline(code) {
  try {
    const snap = await get(ref(db, `access_codes/${code}`));
    if (!snap.exists()) {
      localStorage.removeItem(LS_KEY);
      window.lockApp('Код удалён администратором');
      return;
    }
    const d = snap.val();
    if (d.usedBy && d.usedBy !== DEVICE_ID) {
      localStorage.removeItem(LS_KEY);
      window.lockApp('Код переназначен другому устройству');
    }
  } catch (e) {}
}

(async () => {
  if (window.gasOfflineAccessGranted) {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) verifyAccessOnline(saved);
    return;
  }
  lockStatusEl.textContent = 'Подключение...';
  try {
    await ensureCodesExist();
    lockStatusEl.textContent = 'Готово к вводу кода';
    const existingCode = await findDeviceCode();
    if (existingCode) {
      localStorage.setItem(LS_KEY, existingCode);
      window.unlockApp();
    }
  } catch (e) {
    lockStatusEl.textContent = 'Нет связи с сервером';
    lockErrorEl.textContent = 'Для первого входа нужен интернет';
  }
})();

function grantAccess(code) {
  localStorage.setItem(LS_KEY, code);
  window.unlockApp();
}

async function tryUnlock() {
  const input = document.getElementById('codeInput');
  const raw = input.value.replace(/\D/g, '');
  lockErrorEl.textContent = '';

  if (!raw) { lockErrorEl.textContent = 'Введите код'; return; }
  if (!INITIAL_CODES.includes(raw)) { lockErrorEl.textContent = 'Неверный код доступа'; return; }

  lockErrorEl.textContent = 'Проверка...';
  try {
    const codeRef = ref(db, `access_codes/${raw}`);
    const snap = await get(codeRef);
    const d = snap.exists() ? snap.val() : null;

    if (d && d.usedBy === DEVICE_ID) { grantAccess(raw); return; }
    if (!d || d.available === true || !d.usedBy) {
      await set(codeRef, { available: false, usedBy: DEVICE_ID, usedAt: Date.now() });
      grantAccess(raw);
      return;
    }
    lockErrorEl.textContent = 'Этот код уже использован другим устройством';
  } catch (e) {
    lockErrorEl.textContent = 'Нет связи с сервером';
  }
}

document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryUnlock();
});
document.getElementById('codeInput').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
});

/* ============================================================
   🔢 СЧЁТЧИК ЗАЯВОК — с локальным «запасом» номера
   ============================================================ */

/* Получить номер из Firebase и увеличить счётчик (атомарно) */
async function fetchAndBumpNumber() {
  try {
    const counterRef = ref(db, 'requests_counter');
    const result = await runTransaction(counterRef, (current) => {
      const n = typeof current === 'number' ? current : 0;
      return n + 1;
    });
    if (result.committed) return result.snapshot.val();
    const snap = await get(counterRef);
    return snap.exists() ? snap.val() : 1;
  } catch (e) {
    console.warn('[number] ошибка:', e.message);
    return null;
  }
}

/* Прогреваем локальный номер заранее — чтобы тап по кнопке был мгновенным */
window.warmUpNextNumber = async function() {
  const cached = localStorage.getItem(NEXT_NUM_KEY);
  if (cached) return Number(cached);   // уже есть в запасе

  const num = await fetchAndBumpNumber();
  if (num != null) {
    localStorage.setItem(NEXT_NUM_KEY, String(num));
  }
  return num;
};

/* Мгновенно вернуть номер (если есть в localStorage) */
window.peekNextNumber = function() {
  const cached = localStorage.getItem(NEXT_NUM_KEY);
  return cached ? Number(cached) : null;
};

/* Сохранить заявку с номером, при необходимости достать номер из Firebase */
window.saveRequestFast = async function(payload) {
  // Если номер уже есть в payload — сохраняем как есть
  if (payload.number != null) {
    try {
      await set(ref(db, `zayavki_grozny/${payload.number}`), payload);
      // Использованный номер убираем из запаса
      localStorage.removeItem(NEXT_NUM_KEY);
      // И сразу готовим следующий номер
      window.warmUpNextNumber();
      return true;
    } catch (e) {
      console.error('[firebase] saveRequestFast:', e);
      return false;
    }
  }
  // Иначе — запрашиваем номер и сохраняем
  const num = await fetchAndBumpNumber();
  if (num == null) return false;
  payload.number = num;
  try {
    await set(ref(db, `zayavki_grozny/${num}`), payload);
    return true;
  } catch (e) {
    console.error('[firebase] saveRequestFast (fallback):', e);
    return false;
  }
};

/* Пробуем прогреть номер сразу при загрузке страницы */
setTimeout(() => { window.warmUpNextNumber(); }, 1500);

console.log('[firebase] модуль загружен, DEVICE_ID:', DEVICE_ID);
</script>

<!-- ============== СКРИПТ 3 — Форма ============== -->
<script>
function normalizeAddress(s) {
  s = (s || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  s = s.replace(/[.,]{2,}/g, m => m[0]);
  s = s.replace(/([.,])(?=\S)/g, '$1 ');
  s = s.replace(/(^|[\s.,])([а-яёa-z])/gi, (m, sep, ch) => sep + ch.toUpperCase());
  return s.trim();
}
function normalizePhone(s) {
  const digits = (s || '').replace(/\D/g, '');
  if (!digits) return '';
  let d = digits;
  if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
  if (d.length === 10) d = '7' + d;
  if (d.length === 11 && d[0] === '7') {
    return `+7 (${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9,11)}`;
  }
  return '+' + d;
}

const addressEl = document.getElementById('address');
const phoneEl   = document.getElementById('phone');
const modelEl   = document.getElementById('meterModel');

addressEl.addEventListener('blur', () => { addressEl.value = normalizeAddress(addressEl.value); });
phoneEl.addEventListener('blur',   () => { phoneEl.value   = normalizePhone(phoneEl.value); });
modelEl.addEventListener('input', () => {
  const start = modelEl.selectionStart;
  const end = modelEl.selectionEnd;
  modelEl.value = modelEl.value.toUpperCase();
  modelEl.setSelectionRange(start, end);
});

const photos = [];
const cameraInput  = document.getElementById('cameraInput');
const galleryInput = document.getElementById('galleryInput');
const photoGrid    = document.getElementById('photoGrid');
const photoCounter = document.getElementById('photoCounter');

document.getElementById('cameraBtn').addEventListener('click', () => cameraInput.click());
document.getElementById('galleryBtn').addEventListener('click', () => galleryInput.click());

function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    photos.push({ file: f, url: URL.createObjectURL(f) });
  }
  renderPhotos();
}
cameraInput.addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
galleryInput.addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });

function renderPhotos() {
  photoGrid.innerHTML = '';
  photos.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'photo-item';
    const img = document.createElement('img');
    img.src = p.url;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'remove';
    btn.textContent = '×';
    btn.addEventListener('click', () => {
      URL.revokeObjectURL(p.url);
      photos.splice(idx, 1);
      renderPhotos();
    });
    div.appendChild(img); div.appendChild(btn);
    photoGrid.appendChild(div);
  });
  if (photos.length > 0) {
    photoCounter.style.display = 'block';
    photoCounter.textContent = `Выбрано фото: ${photos.length}`;
  } else { photoCounter.style.display = 'none'; }
}

function clearForm() {
  addressEl.value = ''; phoneEl.value = ''; modelEl.value = '';
  document.getElementById('comment').value = '';
  photos.forEach(p => { try { URL.revokeObjectURL(p.url); } catch(e){} });
  photos.length = 0; renderPhotos();
  if (typeof window.startGeo === 'function') window.startGeo();
}

function showToast(msg, duration) {
  duration = duration || 3000;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove('show'), duration);
}
